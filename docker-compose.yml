version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asklab
      POSTGRES_PASSWORD: asklab
      POSTGRES_DB: asklab
    volumes:
      - asklab_pg:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://asklab:asklab@postgres:5432/asklab?schema=public
      JWT_ACCESS_SECRET: "5GshjkoJV6kpC35yHXoE8Y3S22A9nd3tVboarTba/vU="
      JWT_REFRESH_SECRET: "vUMhMDm3jhZ4eT/8MrG/UqimllT31Udfd8TYlszry/Y="
      NODE_ENV: production
    volumes:
      - asklab_uploads:/data/uploads
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  asklab_pg:
  asklab_uploads:
