services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asklab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asklab}
      POSTGRES_DB: ${POSTGRES_DB:-asklab}
      TZ: America/Recife
    volumes:
      - asklab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asklab}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/ailtonbcosta-ti/asklabcontrol-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asklab}:${POSTGRES_PASSWORD:-asklab}@postgres:5432/${POSTGRES_DB:-asklab}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-asklab_access_secret_change_me_32x}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-asklab_refresh_secret_change_me_32}
      NODE_ENV: production
      PORT: 3001
      TZ: America/Recife
    volumes:
      - asklab_uploads:/data/uploads

  frontend:
    image: ghcr.io/ailtonbcosta-ti/asklabcontrol-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: America/Recife

volumes:
  asklab_pg:
  asklab_uploads:
