server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100m;
  server_tokens off;

  # Cabeçalhos de segurança ficam nos blocos location do SPA (abaixo). O /api/
  # já recebe os cabeçalhos do helmet no backend — não duplicar aqui.

  # Usa o resolver DNS interno do Docker para resolução dinâmica
  # Evita "host not found in upstream" no startup quando o backend ainda não está pronto
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /api/ {
    set $backend http://backend:3001;
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets com hash no nome: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    # index.html nunca em cache, para que novos deploys sejam carregados
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
